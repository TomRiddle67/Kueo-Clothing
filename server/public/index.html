<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kueo - Coming Soon</title>
    <link rel = "stylesheet" href= "/styles.css"/>
</head>
<body>
    <main class= "container">
        <header class="brand">
            <h1 class="brand-name">Kueo Clothing</h1>
            <p class = "brand-tagline"> Modern clothing for little ones </p>
        </header>
        <section class="message">
            <h2 class="message-heading"> Coming Soon..</h2>
            <p class="message-body"> 
                Be the first to know when we launch.
            </p>
        </section>

        <section class="waitlist">
            <form class="waitlist-form" action="/waitlist" method="POST">
                <input
                type="email"
                name="email"
                class="waitlist-input"
                Placeholder="Enter your email address"
                required
                />
                <button type="submit" class="waitlist-button">
                    Notify me
                </button>
            </form>
        </section>

        <footer class="footer">
            <p>© 2026 Kueo. All rights reserved.</p>
        </footer>

    </main>
    
</body>
</html>
