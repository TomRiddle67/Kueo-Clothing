<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kueo Clothings - Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
    <main class="container">

        <header class="brand">
            <img src="/logo.png" alt="Kueo Clothings" class="brand-logo" />
            <p class="brand-tagline">Modern clothing for little ones</p>
        </header>

        <section class="message">
            <h2 class="message-heading">Coming Soon..</h2>
            <p class="message-body">
                Be the first to know when we launch.
            </p>
        </section>

        <section class="waitlist">
            <form class="waitlist-form" action="/waitlist" method="POST">
                <input
                    type="email"
                    name="email"
                    class="waitlist-input"
                    placeholder="Enter your email address"
                    required
                />
                <button type="submit" class="waitlist-button">
                    Notify me 
                </button>
            </form>
        </section>

    <a 
        href="https://wa.me/2348000000000"
        target="_blank"
        rel="noopener noreferrer"
        class="whatsapp-button"
    >
        Chat with us on WhatsApp
    </a>

        <footer class="footer">
            <p>© 2026 Kueo Clothings. All rights reserved.</p>
        </footer>

    </main>
</body>
</html>
